<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win32 Message Architecture Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #12141a;
            color: #e5e7eb;
            overflow-x: hidden;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Smooth glow and shadow effects */
        .box-glow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid #374151;
            background-color: #1f222b;
        }

        .message-pill {
            position: absolute;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform: translate(-50%, -50%);
        }

        .pill-queued { background-color: #3b82f6; color: white; border: 1px solid #60a5fa; }
        .pill-direct { background-color: #ef4444; color: white; border: 1px solid #f87171; }
        
        /* SVG Line Animations */
        .dash-line { stroke-dasharray: 6; animation: dash 1s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -12; } }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 8px;
            border-radius: 4px;
            background: #93c5fd;
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }

        /* Pulse animation for WndProc processing */
        @keyframes pulse-border {
            0% { border-color: #374151; }
            50% { border-color: #9ca3af; box-shadow: 0 0 15px rgba(156, 163, 175, 0.3); }
            100% { border-color: #374151; }
        }
        .wndproc-processing { animation: pulse-border 0.3s ease-out; }

        /* Direct function call animations */
        @keyframes thread-call {
            0% { stroke: #7f1d1d; stroke-width: 2; opacity: 0.8; }
            20% { stroke: #ef4444; stroke-width: 4; opacity: 1; filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.8)); }
            80% { stroke: #ef4444; stroke-width: 4; opacity: 1; filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.8)); }
            100% { stroke: #7f1d1d; stroke-width: 2; opacity: 0.8; }
        }
        .animate-thread-call { animation: thread-call 0.5s ease-out; }

        @keyframes os-active {
            0% { background-color: #1f222b; border-color: #374151; }
            50% { background-color: #2c1616; border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
            100% { background-color: #1f222b; border-color: #374151; }
        }
        .os-processing { animation: os-active 0.5s ease-out; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl bg-[#1a1c23] rounded-2xl border border-gray-800 p-6 shadow-2xl flex flex-col gap-6">
        
        <!-- Top Header Stats -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <h1 class="text-xl font-bold tracking-wide">Win32 Message Architecture</h1>
            <div class="flex gap-6 text-sm">
                <div class="flex flex-col">
                    <span class="text-gray-400 font-semibold text-xs tracking-wider uppercase">Queue Load</span>
                    <span id="stat-queue-load" class="font-mono text-lg font-bold text-white">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-gray-400 font-semibold text-xs tracking-wider uppercase">Queued Count</span>
                    <span id="stat-queued-count" class="font-mono text-lg font-bold text-white">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-gray-400 font-semibold text-xs tracking-wider uppercase">Direct Count</span>
                    <span id="stat-direct-count" class="font-mono text-lg font-bold text-white">0</span>
                </div>
                <div class="flex flex-col min-w-[120px]">
                    <span class="text-gray-400 font-semibold text-xs tracking-wider uppercase">Last Message</span>
                    <span id="stat-last-msg" class="font-mono text-lg font-bold text-blue-400">NONE</span>
                </div>
            </div>
        </div>

        <!-- Main Diagram Canvas -->
        <div id="diagram-canvas" class="relative w-full h-[400px] bg-[#12141a] rounded-xl border border-gray-800 overflow-hidden">
            <!-- SVG Lines Overlay -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" id="svg-lines">
                <!-- OS to Queue -->
                <path id="line-os-queue" class="dash-line" fill="none" stroke="#4b5563" stroke-width="2"/>
                <!-- Queue to Loop -->
                <path id="line-queue-loop" class="dash-line" fill="none" stroke="#4b5563" stroke-width="2"/>
                <!-- Loop to WndProc -->
                <path id="line-loop-wndproc" class="dash-line" fill="none" stroke="#4b5563" stroke-width="2"/>
                <!-- OS to WndProc (Direct) -->
                <path id="line-os-wndproc" fill="none" stroke="#7f1d1d" stroke-width="2" opacity="0.8"/>
            </svg>

            <!-- Node Boxes -->
            <div id="node-os" class="box-glow absolute w-3/4 h-16 rounded-lg flex items-center justify-center font-bold text-gray-300 z-10 left-1/2 transform -translate-x-1/2 top-8">
                Windows OS Layer
            </div>

            <div id="node-queue" class="box-glow absolute w-48 h-20 rounded-lg flex flex-col items-center justify-center font-bold text-gray-300 z-10 left-[15%] top-40 relative group">
                <span>Message Queue</span>
                <span class="text-xs font-mono text-gray-400 font-normal mt-1">FIFO Stack: <span id="queue-display-count">0</span></span>
            </div>

            <div id="node-loop" class="box-glow absolute w-48 h-20 rounded-lg flex flex-col items-center justify-center font-bold text-gray-300 z-10 right-[30%] top-40">
                <!-- Sleeping Badge -->
                <div id="loop-badge" class="absolute -top-3 px-3 py-0.5 border rounded-full text-[10px] font-bold tracking-widest bg-[#12141a] border-gray-500 text-gray-400 transition-colors">
                    SLEEPING
                </div>
                Message Loop
                <span class="text-[10px] font-mono text-gray-400 font-normal mt-1">GetMessage()</span>
            </div>

            <div id="node-wndproc" class="box-glow absolute w-3/4 h-20 rounded-lg flex items-center justify-center font-bold text-gray-300 z-10 left-1/2 transform -translate-x-1/2 bottom-8">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2 text-gray-400"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                Window Procedure (WndProc)
            </div>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 gap-4 mt-2">
            <button onclick="triggerQueuedEvent()" class="py-3 px-4 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 border border-gray-700 rounded-lg text-sm font-semibold transition-colors duration-200">
                Hardware Event (Queued)
            </button>
            <button onclick="triggerDirectEvent()" class="py-3 px-4 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 border border-gray-700 rounded-lg text-sm font-semibold transition-colors duration-200">
                OS Event (Non-Queued)
            </button>
        </div>

        <div class="flex items-center gap-4 px-2 pt-2 border-t border-gray-800">
            <label class="text-sm font-semibold text-gray-400 whitespace-nowrap">Animation Speed</label>
            <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="1.5" class="w-full">
            <span id="speed-display" class="text-sm font-mono text-gray-300 w-12">1.5x</span>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            queueLoad: 0,
            queuedCount: 0,
            directCount: 0,
            isLoopSleeping: true,
            baseDuration: 1000, // 1 second base travel time
        };

        const queuedMessageTypes = ["WM_MOUSEMOVE", "WM_KEYDOWN", "WM_LBUTTONDOWN", "WM_PAINT", "WM_TIMER"];
        const directMessageTypes = ["WM_SIZE", "WM_WINDOWPOSCHANGING", "WM_ACTIVATE", "WM_SETFOCUS"];

        // --- DOM Elements ---
        const canvas = document.getElementById('diagram-canvas');
        const nodes = {
            os: document.getElementById('node-os'),
            queue: document.getElementById('node-queue'),
            loop: document.getElementById('node-loop'),
            wndproc: document.getElementById('node-wndproc')
        };
        const stats = {
            queueLoad: document.getElementById('stat-queue-load'),
            queuedCount: document.getElementById('stat-queued-count'),
            directCount: document.getElementById('stat-direct-count'),
            lastMsg: document.getElementById('stat-last-msg'),
            queueDisplay: document.getElementById('queue-display-count')
        };
        const loopBadge = document.getElementById('loop-badge');
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');

        // --- Configuration & Utility ---
        const getSpeedMultiplier = () => parseFloat(speedSlider.value);

        speedSlider.addEventListener('input', (e) => {
            speedDisplay.textContent = e.target.value + 'x';
        });

        // Get coordinates relative to the canvas
        function getCenterCoords(element) {
            const canvasRect = canvas.getBoundingClientRect();
            const elRect = element.getBoundingClientRect();
            return {
                x: elRect.left - canvasRect.left + elRect.width / 2,
                y: elRect.top - canvasRect.top + elRect.height / 2,
                bottom: elRect.bottom - canvasRect.top,
                top: elRect.top - canvasRect.top,
                right: elRect.right - canvasRect.left,
                left: elRect.left - canvasRect.left
            };
        }

        // Draw connecting lines via SVG
        function updateLines() {
            const os = getCenterCoords(nodes.os);
            const q = getCenterCoords(nodes.queue);
            const l = getCenterCoords(nodes.loop);
            const w = getCenterCoords(nodes.wndproc);

            // OS to Queue (Vertical then Horizontal)
            document.getElementById('line-os-queue').setAttribute('d', 
                `M ${os.x - 200} ${os.bottom} L ${os.x - 200} ${q.y} L ${q.right} ${q.y}`
            );

            // Queue to Loop (Horizontal)
            document.getElementById('line-queue-loop').setAttribute('d', 
                `M ${q.right} ${q.y} L ${l.left} ${l.y}`
            );

            // Loop to WndProc (Vertical)
            document.getElementById('line-loop-wndproc').setAttribute('d', 
                `M ${l.x} ${l.bottom} L ${l.x} ${w.top}`
            );

            // OS to WndProc (Direct Bypass Path - right side)
            document.getElementById('line-os-wndproc').setAttribute('d', 
                `M ${os.x + 200} ${os.bottom} L ${os.x + 200} ${w.top}`
            );
        }

        // Initial line draw and window resize handling
        updateLines();
        window.addEventListener('resize', updateLines);

        // --- Animation Engine ---
        function createMessagePill(text, type) {
            const pill = document.createElement('div');
            pill.className = `message-pill pill-${type}`;
            pill.textContent = text;
            canvas.appendChild(pill);
            return pill;
        }

        function animatePath(pill, startCoords, endCoords, onComplete) {
            const duration = state.baseDuration / getSpeedMultiplier();
            
            // Set initial position
            pill.style.left = `${startCoords.x}px`;
            pill.style.top = `${startCoords.y}px`;

            const animation = pill.animate([
                { transform: `translate(-50%, -50%) translate(0px, 0px)` },
                { transform: `translate(-50%, -50%) translate(${endCoords.x - startCoords.x}px, ${endCoords.y - startCoords.y}px)` }
            ], {
                duration: duration,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => {
                if (onComplete) onComplete();
            };
        }

        // --- Logic & Routing ---

        function updateUIStats() {
            stats.queueLoad.textContent = state.queueLoad;
            stats.queuedCount.textContent = state.queuedCount;
            stats.directCount.textContent = state.directCount;
            stats.queueDisplay.textContent = state.queueLoad;
        }

        function setLoopState(isSleeping) {
            state.isLoopSleeping = isSleeping;
            if (isSleeping) {
                loopBadge.textContent = "SLEEPING";
                loopBadge.className = "absolute -top-3 px-3 py-0.5 border rounded-full text-[10px] font-bold tracking-widest bg-[#12141a] border-gray-500 text-gray-400 transition-colors";
            } else {
                loopBadge.textContent = "PROCESSING";
                loopBadge.className = "absolute -top-3 px-3 py-0.5 border rounded-full text-[10px] font-bold tracking-widest bg-green-900 border-green-500 text-green-300 transition-colors shadow-[0_0_10px_rgba(34,197,94,0.3)]";
            }
        }

        function triggerWndProcHit(msgText, isQueued) {
            stats.lastMsg.textContent = msgText;
            stats.lastMsg.className = `font-mono text-lg font-bold ${isQueued ? 'text-blue-400' : 'text-red-400'}`;
            
            nodes.wndproc.classList.remove('wndproc-processing');
            void nodes.wndproc.offsetWidth; // trigger reflow
            nodes.wndproc.classList.add('wndproc-processing');

            if (isQueued) state.queuedCount++;
            else state.directCount++;
            
            updateUIStats();
        }

        // 1. Hardware Event (Queued)
        function triggerQueuedEvent() {
            const msgType = queuedMessageTypes[Math.floor(Math.random() * queuedMessageTypes.length)];
            const pill = createMessagePill(msgType, 'queued');
            
            const osCoords = getCenterCoords(nodes.os);
            const qCoords = getCenterCoords(nodes.queue);
            
            // Start position (left side of OS box)
            const start = { x: osCoords.x - 200, y: osCoords.bottom };

            animatePath(pill, start, qCoords, () => {
                pill.remove();
                state.queueLoad++;
                updateUIStats();
                checkQueueAndProcess();
            });
        }

        // Processing the queue (Message Loop)
        function checkQueueAndProcess() {
            // If already processing, do nothing (it will naturally loop)
            if (!state.isLoopSleeping) return;
            
            if (state.queueLoad > 0) {
                processNextInQueue();
            }
        }

        function processNextInQueue() {
            if (state.queueLoad === 0) {
                setLoopState(true); // Go back to sleep
                return;
            }

            setLoopState(false); // Wake up
            state.queueLoad--;
            updateUIStats();

            // Spawn pill from Queue to Loop
            const msgType = "WM_EVENT"; // Generic for the visual flow
            const pill = createMessagePill("QUEUED_MSG", 'queued');
            
            const qCoords = getCenterCoords(nodes.queue);
            const lCoords = getCenterCoords(nodes.loop);
            const wCoords = getCenterCoords(nodes.wndproc);

            // Queue -> Loop
            animatePath(pill, qCoords, lCoords, () => {
                // Loop -> WndProc
                const dropStart = { x: lCoords.x, y: lCoords.bottom };
                const dropEnd = { x: lCoords.x, y: wCoords.top };
                
                pill.style.transform = "translate(-50%, -50%)"; // reset transform
                
                animatePath(pill, dropStart, dropEnd, () => {
                    pill.remove();
                    triggerWndProcHit("WM_...", true);
                    
                    // Recursive call to process next message
                    setTimeout(() => {
                        processNextInQueue();
                    }, 100 / getSpeedMultiplier()); // Tiny delay between loop iterations
                });
            });
        }

        // 2. OS Event (Non-Queued / Direct)
        function triggerDirectEvent() {
            const msgType = directMessageTypes[Math.floor(Math.random() * directMessageTypes.length)];
            
            // Instead of a travelling message pill, visualize a direct synchronous function call.
            // The OS thread directly invokes the WndProc function.
            const line = document.getElementById('line-os-wndproc');
            
            // Flash the OS Layer to show it is initiating the call
            nodes.os.classList.remove('os-processing');
            void nodes.os.offsetWidth; 
            nodes.os.classList.add('os-processing');

            // Flash the execution path (representing the call stack)
            line.classList.remove('animate-thread-call');
            void line.offsetWidth;
            line.classList.add('animate-thread-call');

            // Almost immediately hit WndProc (simulating synchronous execution)
            setTimeout(() => {
                triggerWndProcHit(msgType, false);
            }, 100);
        }
    </script>
</body>
</html>
