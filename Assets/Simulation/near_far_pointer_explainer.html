<div class="root">
  <div class="header">
    <h1>Near &amp; Far Pointers — Intel 8086</h1>
    <p>How 16-bit code addressed 1 megabyte of RAM through segmented memory</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setTab('near')">Near pointer</button>
    <button class="tab" onclick="setTab('far')">Far pointer</button>
    <button class="tab" onclick="setTab('compare')">Compare &amp; code</button>
  </div>
  <div class="main">
    <div class="left" id="left-pane"></div>
    <div class="right" id="ram-panel">
      <div class="ram-label">1 MB physical RAM</div>
      <div class="ram-wrap">
        <div class="addr-labels">
          <span>0x00000</span>
          <span>0x3FFFF</span>
          <span>0x7FFFF</span>
          <span>0xBFFFF</span>
          <span>0xFFFFF</span>
        </div>
        <div class="ram-stick">
          <div class="ram-lines"></div>
          <div class="seg-box" id="vis-seg" style="top:25%;height:6.25%">
            <div class="seg-box-label">64 KB segment</div>
          </div>
          <div class="ptr-line" id="vis-ptr" style="top:25%">
            <div class="ptr-dot"></div>
            <div class="ptr-label" id="vis-addr">0x40000</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let mode = 'near';
  let segVal = 0x4000;
  let offVal = 0x0000;
  const TOTAL = 1048576;

  function hex(n, pad) { return '0x' + n.toString(16).toUpperCase().padStart(pad, '0'); }

  function nearHTML() {
    return `
    <div class="concept-card">
      <h2>What is a near pointer?</h2>
      <div class="definition">
        A <span style="color:#93c5fd;font-weight:500">near pointer</span> is a <span style="color:#93c5fd;font-weight:500">16-bit</span> value storing only an <span style="color:#6ee7b7;font-weight:500">offset</span> within a segment. It has no segment field — it always implicitly uses the current <span style="color:#93c5fd;font-weight:500">DS</span> (or CS/SS) register.<br><br>
        Because 16 bits can only count up to 65,535, a near pointer is permanently confined to a <span style="color:#fbbf24;font-weight:500">64 KB window</span>. It cannot escape to another segment on its own.
      </div>
    </div>
    <div class="concept-card">
      <h2>Adjust the offset</h2>
      <p class="definition" style="margin-bottom:12px">The segment is fixed by the CPU's DS register. Only the offset (the pointer value itself) moves within the 64 KB box on the right.</p>
      <div class="reg-group">
        <label>Segment register DS <span class="locked-badge">— near pointer cannot change this</span></label>
        <div class="reg-row">
          <input type="range" id="sl-seg" min="0" max="61440" step="4096" value="${segVal}" disabled>
          <span class="reg-val" style="color:#3b82f6">${hex(segVal, 4)}</span>
        </div>
      </div>
      <div class="reg-group">
        <label>Offset — this IS the near pointer's value</label>
        <div class="reg-row">
          <input type="range" id="sl-off" min="0" max="65535" step="256" value="${offVal}">
          <span class="reg-val" id="disp-off" style="color:#6ee7b7">${hex(offVal, 4)}</span>
        </div>
      </div>
    </div>
    <div class="math-box">
      <h3>CPU physical address calculation</h3>
      <div class="math-row"><span style="color:#9ca3af">DS &lt;&lt; 4 (segment × 16)</span><span style="color:#93c5fd" id="m-seg">${hex(segVal * 16, 5)}</span></div>
      <div class="math-row"><span style="color:#9ca3af">+ offset (near pointer)</span><span style="color:#6ee7b7" id="m-off">${hex(offVal, 4)}</span></div>
      <div class="math-row total"><span style="color:#e5e7eb">Physical address</span><span style="color:#fbbf24" id="m-phys">${hex(segVal * 16 + offVal, 5)}</span></div>
    </div>
    <div class="note-box">
      <span style="color:#fbbf24">Key limit:</span> No matter what offset you set, the pointer stays inside the one blue 64 KB box. To reach another area of RAM you'd have to change the DS register in assembly — the near pointer itself is powerless to do that.
    </div>`;
  }

  function farHTML() {
    return `
    <div class="concept-card">
      <h2>What is a far pointer?</h2>
      <div class="definition">
        A <span style="color:#93c5fd;font-weight:500">far pointer</span> is a <span style="color:#93c5fd;font-weight:500">32-bit</span> value packed as <span style="color:#fbbf24;font-weight:500">segment:offset</span>. It carries its own segment, so it is self-contained — no need to manually load a segment register.<br><br>
        With 16 bits for the segment the 64 KB window can be placed <em>anywhere</em> in the 1 MB address space, giving full reach across all of RAM.
      </div>
    </div>
    <div class="concept-card">
      <h2>Adjust both segment and offset</h2>
      <p class="definition" style="margin-bottom:12px">Drag the segment slider to move the entire 64 KB window. Drag the offset to move the pointer within that window. Watch the RAM diagram on the right.</p>
      <div class="reg-group">
        <label>Segment (upper 16 bits of the 32-bit far pointer)</label>
        <div class="reg-row">
          <input type="range" id="sl-seg" min="0" max="61440" step="4096" value="${segVal}">
          <span class="reg-val" id="disp-seg" style="color:#93c5fd">${hex(segVal, 4)}</span>
        </div>
      </div>
      <div class="reg-group">
        <label>Offset (lower 16 bits of the 32-bit far pointer)</label>
        <div class="reg-row">
          <input type="range" id="sl-off" min="0" max="65535" step="256" value="${offVal}">
          <span class="reg-val" id="disp-off" style="color:#6ee7b7">${hex(offVal, 4)}</span>
        </div>
      </div>
    </div>
    <div class="math-box">
      <h3>CPU physical address calculation</h3>
      <div class="math-row"><span style="color:#9ca3af">Segment &lt;&lt; 4</span><span style="color:#93c5fd" id="m-seg">${hex(segVal * 16, 5)}</span></div>
      <div class="math-row"><span style="color:#9ca3af">+ offset</span><span style="color:#6ee7b7" id="m-off">${hex(offVal, 4)}</span></div>
      <div class="math-row total"><span style="color:#e5e7eb">Physical address</span><span style="color:#fbbf24" id="m-phys">${hex(segVal * 16 + offVal, 5)}</span></div>
    </div>
    <div class="note-box">
      <span style="color:#fbbf24">The overlap quirk:</span> Two different segment:offset pairs can point to the <em>same</em> physical byte. <span style="font-family:'JetBrains Mono',monospace;font-size:12px">1000:0010</span> and <span style="font-family:'JetBrains Mono',monospace;font-size:12px">1001:0000</span> both equal physical <span style="font-family:'JetBrains Mono',monospace;font-size:12px">0x10010</span>. This caused many subtle aliasing bugs in DOS-era code.
    </div>`;
  }

  function compareHTML() {
    return `
    <div class="concept-card">
      <h2>Side-by-side comparison</h2>
      <div class="cmp-grid">
        <div class="cmp-cell">
          <div class="cmp-cell-title">Near pointer</div>
          <div class="cmp-row">Size: <span style="color:#e5e7eb">16 bits (2 bytes)</span><br>Stores: <span style="color:#6ee7b7">offset only</span><br>Reach: <span style="color:#e5e7eb">64 KB max</span><br>Speed: <span style="color:#e5e7eb">faster</span><br>Model: <span style="color:#e5e7eb">tiny / small</span></div>
        </div>
        <div class="cmp-cell">
          <div class="cmp-cell-title">Far pointer</div>
          <div class="cmp-row">Size: <span style="color:#e5e7eb">32 bits (4 bytes)</span><br>Stores: <span style="color:#6ee7b7">segment + offset</span><br>Reach: <span style="color:#e5e7eb">full 1 MB</span><br>Speed: <span style="color:#e5e7eb">slower (seg reload)</span><br>Model: <span style="color:#e5e7eb">compact / large</span></div>
        </div>
      </div>
    </div>
    <div class="concept-card">
      <h2>Turbo C / Borland era code</h2>
<div class="code-block"><span style="color:#4b5563">// Near pointer — offset only, uses default DS segment</span>
<span style="color:#34d399">int</span> <span style="color:#93c5fd">near</span> *np;
np = (<span style="color:#34d399">int</span> <span style="color:#93c5fd">near</span>*) <span style="color:#fbbf24">0x1234</span>;   <span style="color:#4b5563">// 2-byte value, offset only</span>
*np = <span style="color:#fbbf24">42</span>;

<span style="color:#4b5563">// Far pointer — carries its own segment</span>
<span style="color:#34d399">int</span> <span style="color:#93c5fd">far</span> *fp;
fp = (<span style="color:#34d399">int</span> <span style="color:#93c5fd">far</span>*) <span style="color:#fbbf24">0xB8000000L</span>; <span style="color:#4b5563">// VGA text buffer!</span>
*fp = <span style="color:#fbbf24">'A'</span>;                    <span style="color:#4b5563">// prints 'A' on screen</span>

<span style="color:#4b5563">// Huge pointer — like far but pointer arithmetic</span>
<span style="color:#4b5563">// automatically normalises across segment boundaries</span>
<span style="color:#34d399">char</span> <span style="color:#93c5fd">huge</span> *hp = (<span style="color:#34d399">char</span> <span style="color:#93c5fd">huge</span>*) <span style="color:#fbbf24">0xA0000000L</span>;</div>
    </div>
    <div class="note-box">
      <span style="color:#fbbf24">Why does this matter today?</span> 32-bit protected mode (386+) and 64-bit x86-64 use a flat address space — one continuous range, no segment juggling. Far pointers are history. But you'll still encounter them in BIOS firmware, DOS emulators, and bootloader code.
    </div>`;
  }

  function setTab(t) {
    mode = t;
    document.querySelectorAll('.tab').forEach((el, i) => {
      el.classList.toggle('active', ['near', 'far', 'compare'][i] === t);
    });
    const rp = document.getElementById('ram-panel');
    rp.style.display = t === 'compare' ? 'none' : '';
    render();
  }

  function render() {
    const pane = document.getElementById('left-pane');
    if (mode === 'near') pane.innerHTML = nearHTML();
    else if (mode === 'far') pane.innerHTML = farHTML();
    else pane.innerHTML = compareHTML();
    bindSliders();
    updateVis();
  }

  function bindSliders() {
    const ss = document.getElementById('sl-seg');
    const so = document.getElementById('sl-off');
    if (ss) ss.addEventListener('input', e => { segVal = +e.target.value; updateCalc(); updateVis(); });
    if (so) so.addEventListener('input', e => { offVal = +e.target.value; updateCalc(); updateVis(); });
  }

  function updateCalc() {
    const ds = document.getElementById('disp-seg');
    const dof = document.getElementById('disp-off');
    if (ds) ds.textContent = hex(segVal, 4);
    if (dof) dof.textContent = hex(offVal, 4);
    const ms = document.getElementById('m-seg');
    const mo = document.getElementById('m-off');
    const mp = document.getElementById('m-phys');
    if (ms) ms.textContent = hex(segVal * 16, 5);
    if (mo) mo.textContent = hex(offVal, 4);
    if (mp) mp.textContent = hex(segVal * 16 + offVal, 5);
  }

  function updateVis() {
    const phys = segVal * 16 + offVal;
    document.getElementById('vis-seg').style.top = ((segVal * 16) / TOTAL * 100) + '%';
    document.getElementById('vis-ptr').style.top = (phys / TOTAL * 100) + '%';
    document.getElementById('vis-addr').textContent = hex(phys, 5);
  }

  render();
</script>
